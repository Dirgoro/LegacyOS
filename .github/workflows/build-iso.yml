name: Build LegacyOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Liberar Espaço em Disco (No Host)
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 5120
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Executar Build em Container Debian Trixie
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            debian:trixie \
            bash -c "
              apt-get update && \
              apt-get install -y --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso \
                isolinux syslinux-common mtools dosfstools rsync sudo && \
              lb build
            "

      - name: Renomear a ISO
        run: mv live-image-amd64.hybrid.iso LegacyOS_1.0.iso

      - name: Fazer Upload da ISO
        uses: actions/upload-artifact@v4
        with:
          name: LegacyOS-ISO-Fase-1
          path: LegacyOS_1.0.iso
          retention-days: 7
