name: Build LegacyOS ISO

on:
  push:
    branches:
      - main
      - "Fase-1---Gemini"
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar dependências do Live-Build
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            ca-certificates \
            findutils \
            sed

      - name: Sanitizar permissões, quebras de linha (LF) e initramfs
        run: |
          # Converte CRLF para LF em scripts, hooks, binários de texto e listas de pacotes
          find auto config -type f \( -name "*.sh" -o -name "*.chroot" -o -name "*.binary" -o -name "*.list*" -o -path "*/bin/*" -o -path "auto/*" \) \
            -exec sed -i 's/\r$//' {} + 2>/dev/null || true

          # Garante permissão de execução nos scripts de build, hooks e ferramentas locais
          chmod -R +x auto/ 2>/dev/null || true
          find config/hooks -type f -exec chmod +x {} + 2>/dev/null || true
          find config/includes.chroot/usr/local/bin -type f -exec chmod +x {} + 2>/dev/null || true

          # Força update-initramfs -u -k all para reconstruir o kernel do chroot Debian Trixie
          if [ -f "config/hooks/normal/0650-setup-visual-theme.hook.chroot" ]; then
            sed -i 's|update-initramfs -u -k all|update-initramfs -u|g' config/hooks/normal/0650-setup-visual-theme.hook.chroot
            sed -i 's|update-initramfs -u|update-initramfs -u -k all|g' config/hooks/normal/0650-setup-visual-theme.hook.chroot
          fi

      - name: Limpar e Configurar Live-Build
        run: |
          lb clean --purge
          lb config

      - name: Compilar ISO do LegacyOS
        run: |
          lb build

      - name: Verificar Initramfs e Artefato ISO
        run: |
          echo "=== Conteúdo de chroot/boot ==="
          ls -lh chroot/boot/vmlinuz* chroot/boot/initrd.img*

          echo "=== Conteúdo de binary/live ==="
          ls -lh binary/live/vmlinuz* binary/live/initrd.img* binary/live/filesystem.squashfs

          ISO_FILE=$(ls -1 *.iso 2>/dev/null | head -n 1)
          if [ -z "$ISO_FILE" ]; then
            echo "ERRO: Nenhum arquivo .iso foi gerado pelo lb build."
            exit 1
          fi
          echo "ISO gerada com sucesso: $ISO_FILE ($(du -h "$ISO_FILE" | cut -f1))"

      - name: Publicar Artefato ISO
        uses: actions/upload-artifact@v4
        with:
          name: LegacyOS-1.0-amd64
          path: "*.iso"
          retention-days: 7
