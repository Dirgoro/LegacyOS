name: Build LegacyOS ISO

on:
  push:
    branches:
      - main
      - "Fase-1---Gemini"
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar dependências do Live-Build
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            ca-certificates \
            findutils \
            sed

      - name: Sanitizar quebras de linha (LF) e isolar hooks suspeitos
        run: |
          # Isola temporariamente os 5 hooks antigos que podem quebrar o user-setup ou o Xorg
          mkdir -p config/hooks/disabled
          for HOOK in \
            0500-enable-phase2.hook.chroot \
            0600-force-password.hook.chroot \
            0600-stabilize-phase1.hook.chroot \
            0680-setup-installer.hook.chroot \
            0700-install-3rd-party.hook.chroot
          do
            if [ -f "config/hooks/normal/$HOOK" ]; then
              mv "config/hooks/normal/$HOOK" "config/hooks/disabled/$HOOK"
              echo "Hook isolado em disabled/: $HOOK"
            fi
          done

          echo "=== Hooks ativos em config/hooks/normal ==="
          ls -la config/hooks/normal/

          # Converte CRLF para LF em todos os scripts e configurações
          find auto config -type f \( \
            -name "*.sh" -o -name "*.chroot" -o -name "*.binary" -o -name "*.list*" \
            -o -name "*.py" -o -name "*.desktop" -o -name "*.xml" -o -name "*.css" \
            -o -name "*.conf" -o -name "*.plymouth" -o -name "*.script" \
            -o -path "*/bin/*" -o -path "auto/*" \
          \) -exec sed -i 's/\r$//' {} + 2>/dev/null || true

          chmod -R +x auto/ 2>/dev/null || true
          find config/hooks/normal -maxdepth 1 -type f -exec chmod +x {} + 2>/dev/null || true
          find config/includes.chroot/usr/local/bin -type f -exec chmod +x {} + 2>/dev/null || true

      - name: Limpar e Configurar Live-Build
        run: |
          lb clean --purge
          lb config

      - name: Compilar ISO do LegacyOS
        run: |
          set -o pipefail
          if ! lb build 2>&1 | tee build.log; then
            echo "=================================================================="
            echo "DIAGNÓSTICO EXATO DO ERRO DO APT / LIVE-BUILD:"
            echo "=================================================================="
            grep -B 35 -m 1 "Begin unmounting filesystems" build.log || tail -n 50 build.log
            exit 1
          fi

      - name: Validar Artefato ISO
        run: |
          ISO_FILE=$(ls -1 *.iso 2>/dev/null | head -n 1)
          if [ -z "$ISO_FILE" ]; then
            echo "ERRO: Nenhum arquivo .iso foi gerado pelo lb build."
            exit 1
          fi
          echo "ISO gerada com sucesso: $ISO_FILE ($(du -h "$ISO_FILE" | cut -f1))"

      - name: Publicar Artefato ISO
        uses: actions/upload-artifact@v4
        with:
          name: LegacyOS-1.0-amd64
          path: "*.iso"
          retention-days: 7
