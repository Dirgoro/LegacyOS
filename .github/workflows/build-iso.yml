name: Build LegacyOS ISO

on:
  push:
    branches:
      - main
      - "Fase-1---Gemini"
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar dependências do Live-Build
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            ca-certificates \
            findutils \
            sed

      - name: Sanitizar quebras de linha (LF) e permissões
        run: |
          find auto config -type f \( \
            -name "*.sh" -o -name "*.chroot" -o -name "*.binary" -o -name "*.list*" \
            -o -name "*.py" -o -name "*.desktop" -o -name "*.xml" -o -name "*.css" \
            -o -name "*.conf" -o -name "*.plymouth" -o -name "*.script" \
            -o -path "*/bin/*" -o -path "auto/*" \
          \) -exec sed -i 's/\r$//' {} + 2>/dev/null || true

          chmod -R +x auto/ 2>/dev/null || true
          find config/hooks -type f -exec chmod +x {} + 2>/dev/null || true
          find config/includes.chroot/usr/local/bin -type f -exec chmod +x {} + 2>/dev/null || true

      - name: Limpar e Configurar Live-Build
        run: |
          lb clean --purge
          lb config

      - name: Compilar ISO do LegacyOS
        run: |
          set -o pipefail
          if ! lb build 2>&1 | tee build.log; then
            echo "=== DIAGNÓSTICO DE ERRO DO APT / LIVE-BUILD ==="
            grep -E "^(E:|Err:|W: Failed)" build.log | tail -n 30 || true
            exit 1
          fi

      - name: Validar Initramfs e Artefato ISO
        run: |
          echo "=== Kernel e Initramfs no Chroot ==="
          ls -lh chroot/boot/vmlinuz* chroot/boot/initrd.img*

          echo "=== Kernel, Initramfs e SquashFS na ISO ==="
          ls -lh binary/live/vmlinuz* binary/live/initrd.img* binary/live/filesystem.squashfs

          ISO_FILE=$(ls -1 *.iso 2>/dev/null | head -n 1)
          if [ -z "$ISO_FILE" ]; then
            echo "ERRO: Nenhum ficheiro .iso foi gerado pelo lb build."
            exit 1
          fi
          echo "ISO gerada com sucesso: $ISO_FILE ($(du -h "$ISO_FILE" | cut -f1))"

      - name: Publicar Artefato ISO
        uses: actions/upload-artifact@v4
        with:
          name: LegacyOS-1.0-amd64
          path: "*.iso"
          retention-days: 7
