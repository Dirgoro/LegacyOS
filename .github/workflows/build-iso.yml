name: Build LegacyOS ISO (Debian 13)

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - Fase-4-Refinamento
  #     - "Fase-1---Gemini"

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Dependências do Live-Build (Debian 13)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            syslinux \
            syslinux-common \
            isolinux \
            ca-certificates \
            curl \
            gnupg \
            sed \
            python3 \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gdkpixbuf-2.0 \
            librsvg2-common

      - name: Normalizar Permissões e Quebras de Linha (LF)
        run: |
          find auto config scripts -type f \( -name "*.sh" -o -name "*.chroot" -o -path "auto/*" \) -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          chmod +x auto/* 2>/dev/null || true
          chmod +x scripts/*.sh 2>/dev/null || true
          find config/hooks -type f -exec chmod +x {} + 2>/dev/null || true

      - name: Configurar e Personalizar Bootloader (lb config)
        run: |
          lb clean --purge
          if [ -x "./scripts/customize-bootloader.sh" ]; then
            ./scripts/customize-bootloader.sh
          fi
          lb config
          if [ -x "./scripts/customize-bootloader.sh" ]; then
            ./scripts/customize-bootloader.sh
          fi

      - name: Construir ISO (lb build)
        run: |
          lb build

      - name: Validar Arquivo ISO Gerado
        run: |
          ls -lh *.iso
          if ! ls *.iso 1> /dev/null 2>&1; then
            echo "ERRO CRÍTICO: Nenhuma imagem .iso foi gerada pelo lb build."
            exit 1
          fi

      - name: Publicar ISO como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegacyOS-Alpha-amd64
          path: "*.iso"
          retention-days: 7
