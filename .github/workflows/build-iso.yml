name: Build LegacyOS ISO

on:
  push:
    branches: [ "main", "Fase-3-Polimento" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Liberar Espaço em Disco (Host)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Executar Build em Container Debian Trixie
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            debian:trixie \
            bash -c "
              set -e
              
              echo '[*] Atualizando pacotes...'
              apt-get update
              
              echo '[*] Instalando dependências...'
              apt-get install -y --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso \
                isolinux syslinux-common mtools dosfstools rsync sudo
                
              echo '[*] Listando arquivos no diretório de trabalho:'
              ls -la
              
              echo '[*] Verificando se auto/config existe:'
              if [ ! -f auto/config ]; then
                echo 'ERRO CRÍTICO: auto/config não está no repositório!'
                exit 1
              fi
              
              echo '[*] Executando auto/config...'
              bash auto/config
              
              echo '[*] Iniciando lb build (vai demorar de 30 a 50 minutos)...'
              lb build
            "

      - name: Verificar Integridade da ISO
        run: |
          ISO_FILE=$(find . -maxdepth 1 -name "*.iso" | head -n 1)
          if [ -z "$ISO_FILE" ]; then
            echo "ERRO FATAL: Nenhuma ISO foi gerada."
            exit 1
          fi
          SIZE=$(stat -c%s "$ISO_FILE")
          echo "Tamanho da ISO gerada: $SIZE bytes"
          if [ "$SIZE" -lt 1000000000 ]; then
            echo "ERRO FATAL: A ISO tem menos de 1GB. O build falhou silenciosamente."
            exit 1
          fi
          echo "✅ ISO validada com sucesso!"
          mv "$ISO_FILE" LegacyOS_1.0.iso

      - name: Fazer Upload da ISO
        uses: actions/upload-artifact@v4
        with:
          name: LegacyOS-ISO-Fase-1
          path: LegacyOS_1.0.iso
          retention-days: 7
