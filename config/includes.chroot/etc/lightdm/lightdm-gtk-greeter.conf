[greeter]
background=/usr/share/backgrounds/legacyos-wallpaper.jpg
theme-name=LegacyOS-Theme
icon-theme-name=Papirus-Dark
font-name=Geist 10
xft-antialias=true
xft-dpi=96
xft-hintstyle=hintslight
xft-rgba=rgb
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~power
clock-format=%a, %d %b  %H:%M
default-user-image=/usr/share/pixmaps/legacyos-avatar.png
position=50%,center 50%,center
