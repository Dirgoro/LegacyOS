# LegacyOS Picom Configuration
backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;

# Cantos arredondados (14px)
corner-radius = 14;

# Sombras suaves
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -10;
shadow-offset-y = -10;

# Blur (Dark Glassmorphism)
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-background-exclude = [
    "window_type = 'desktop'",
    "class_g = 'Plank'"
];

# Desempenho (Economia de CPU em Atom/Celeron)
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
